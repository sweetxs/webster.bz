<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>webster.bz</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: #0f1012;
    }
    .wrap {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .frame {
      width: 100%;
      aspect-ratio: 9 / 16;
      max-height: calc(100dvh - 90px);
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .credit {
      font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #9a9aa2;
      text-align: center;
    }
    .credit a { color: #d6d6dc; text-decoration: none; border-bottom: 1px solid #55565c; }
    .credit a:hover { color: #fff; border-color: #fff; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="frame">
      <video src="video.mp4" poster="poster.jpg"
             autoplay muted loop playsinline preload="auto"></video>
    </div>
    <p class="credit">
      <a href="https://www.instagram.com/reel/DfU9Z-4FDTD/" target="_blank" rel="noopener">Fu Shuang</a>
    </p>
  </div>
</body>
</html>
